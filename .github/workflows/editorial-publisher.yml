name: Senjoo Editorial Publisher
on:
  schedule:
    - cron: "30 5 * * 2,4,6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: senjoo-editorial-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish next queued article
        run: python .github/scripts/publish_editorial.py
      - name: Validate generated source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          if (root/".editorial/last_publish.json").exists():
              x=json.loads((root/".editorial/last_publish.json").read_text(encoding="utf-8"))
              s=(root/x["slug"]).read_text(encoding="utf-8")
              assert 'name="robots" content="index,follow"' in s
              assert 'rel="canonical"' in s
              assert '"@type": "Article"' in s or '"@type":"Article"' in s
              assert x["url"] in (root/"sitemap.xml").read_text(encoding="utf-8")
          print("SOURCE_VALIDATE_OK")
          PY
      - name: Commit publication
        id: commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "senjoo-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Publish scheduled Senjoo editorial article"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Live verify
        if: steps.commit.outputs.changed == 'true'
        run: python .github/scripts/verify_editorial.py
